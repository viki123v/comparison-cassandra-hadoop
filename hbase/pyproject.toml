[project]
name = "hbase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "viki123v", email = "viktorhristovski629@gmail.com" }
]
requires-python = ">=3.13.10"
dependencies = [
    "happybase>=1.3.0",
    "msgspec>=0.21.1",
    "poethepoet>=0.48.0",
]

[project.scripts]
hbase = "hbase:main"
hbase-query = "hbase.run_queries:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.poe.tasks]
load_data = "python -m hbase.load_data"
bootstrap_hbase.sequence = ["trim", "load_data"]

[tool.poe.tasks.trim]
cmd = "bash shared/trim.sh"
cwd = ".."
