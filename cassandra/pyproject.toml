[project]
name = "cassandra_nosql"
version = "0.1.0"
description = "Cassandra implementation of the yelp experiment"
readme = "README.md"
authors = [
    { name = "viki123v", email = "viktorhristovski629@gmail.com" }
]
requires-python = ">=3.13.10"
dependencies = [
    "cassandra-driver>=3.30.1",
    "msgspec>=0.21.1",
]

[project.scripts]
cassandra = "cassandra_nosql:main"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"
